<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <title>Activity - File Sharing Portal</title>
</head>
<body>
<nav class="topbar py-3">
  <div class="container d-flex justify-content-between align-items-center">
    <strong>File Sharing Portal</strong>
    <div><a href="owner-dashboard.html" class="text-white me-3">My files</a><span id="who" class="me-3"></span><button class="btn btn-sm btn-outline-light" onclick="logoutUser()">Log out</button></div>
  </div>
</nav>

<main class="container py-4">
  <div id="msg" class="alert d-none" role="alert"></div>
  <section class="card border-0 shadow-sm">
    <div class="card-body">
      <h1 class="h5">Activity log</h1>
      <p class="text-muted small">The latest 100 actions on your files, including downloads by recipients.</p>
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead><tr><th>When</th><th>Who</th><th>Action</th><th>File</th></tr></thead>
          <tbody id="rows"><tr><td colspan="4" class="text-muted">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/auth.js"></script>
<script>
const LABELS = { upload: "Uploaded", share: "Shared", revoke: "Revoked access", download: "Downloaded", delete: "Deleted" };
function cell(t) { const td = document.createElement("td"); td.textContent = t; return td; }

(async () => {
  const me = await requireRole("owner");
  if (!me) return;
  document.getElementById("who").textContent = me.full_name || me.email;

  const { data, error } = await supabaseClient.from("activity_log")
    .select("id, action, created_at, user:profiles!user_id(email, full_name), file:files(original_name)")
    .order("created_at", { ascending: false }).limit(100);

  const body = document.getElementById("rows");
  body.innerHTML = "";
  if (error) return showMessage("msg", "Could not load activity: " + error.message);
  if (!data.length) { body.innerHTML = '<tr><td colspan="4" class="text-muted">No activity yet.</td></tr>'; return; }
  data.forEach(a => {
    const tr = document.createElement("tr");
    tr.append(cell(new Date(a.created_at).toLocaleString()),
              cell(a.user ? (a.user.full_name || a.user.email) : "Unknown"),
              cell(LABELS[a.action] || a.action),
              cell(a.file ? a.file.original_name : "(deleted file)"));
    body.append(tr);
  });
})();
</script>
</body>
</html>
