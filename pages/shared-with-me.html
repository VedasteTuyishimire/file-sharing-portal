<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <title>Shared with me - File Sharing Portal</title>
</head>
<body>
<nav class="topbar py-3">
  <div class="container d-flex justify-content-between align-items-center">
    <strong>File Sharing Portal</strong>
    <div><span id="who" class="me-3"></span><button class="btn btn-sm btn-outline-light" onclick="logoutUser()">Log out</button></div>
  </div>
</nav>

<main class="container py-4">
  <div id="msg" class="alert d-none" role="alert"></div>
  <section class="card border-0 shadow-sm">
    <div class="card-body">
      <h1 class="h5 mb-3">Files shared with me</h1>
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead><tr><th>Name</th><th>From</th><th>Size</th><th>Shared</th><th>Expires</th><th class="text-end">Action</th></tr></thead>
          <tbody id="rows"><tr><td colspan="6" class="text-muted">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/files.js"></script>
<script src="../js/shares.js"></script>
<script>
let me = null;
function cell(t) { const td = document.createElement("td"); td.textContent = t; return td; }

async function refresh() {
  const body = document.getElementById("rows");
  const { data, error } = await listSharedWithMe(me.id);
  body.innerHTML = "";
  if (error) return showMessage("msg", "Could not load files: " + error.message);
  if (!data.length) {
    body.innerHTML = '<tr><td colspan="6" class="text-muted">No files have been shared with you yet.</td></tr>';
    return;
  }
  data.forEach(s => {
    const f = s.file;
    const tr = document.createElement("tr");
    tr.append(cell(f.original_name),
              cell(f.owner ? (f.owner.full_name || f.owner.email) : "Unknown"),
              cell(formatSize(f.file_size)),
              cell(formatDate(s.shared_at)),
              cell(s.expires_at ? formatDate(s.expires_at) : "No expiry"));
    const td = document.createElement("td");
    td.className = "text-end";
    const b = document.createElement("button");
    b.className = "btn btn-sm btn-main";
    b.textContent = "Download";
    b.onclick = async () => {
      const r = await downloadFile(f, me.id);
      if (r.error) showMessage("msg", "Download failed: " + r.error + ". Your access may have been removed or expired.");
    };
    td.append(b); tr.append(td); body.append(tr);
  });
}

(async () => {
  me = await requireRole("recipient");
  if (!me) return;
  document.getElementById("who").textContent = me.full_name || me.email;
  refresh();
})();
</script>
</body>
</html>
