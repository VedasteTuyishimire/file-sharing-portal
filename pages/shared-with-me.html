<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <title>Shared with me - File Sharing Portal</title>
</head>
<body>
<nav class="topbar py-3">
  <div class="container d-flex justify-content-between align-items-center">
    <strong>File Sharing Portal</strong>
    <div class="d-flex align-items-center"><button id="avatarBtn" type="button" class="avatar-btn me-2" title="Change profile picture" aria-label="Change profile picture"></button><span id="who" class="me-3"></span><button class="btn btn-sm btn-outline-light" onclick="logoutUser()">Log out</button></div>
  </div>
</nav>

<main class="container py-4">
  <div id="msg" class="alert d-none" role="alert"></div>
  <div id="notice" class="alert alert-success d-none" role="status"></div>
  <section class="card border-0 shadow-sm">
    <div class="card-body">
      <h1 class="h5 mb-3">Files shared with me</h1>
      <div class="row g-2 mb-3">
        <div class="col-md-6"><input id="rowFilter" type="search" class="form-control" placeholder="Search by file or sender..."></div>
        <div class="col-md-6 d-flex align-items-center text-muted small" id="rowCount"></div>
      </div>
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead><tr><th>Name</th><th>From</th><th>Size</th><th>Shared</th><th>Expires</th><th class="text-end">Action</th></tr></thead>
          <tbody id="rows"><tr><td colspan="6" class="text-muted">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/avatar.js"></script>
<script src="../js/files.js"></script>
<script src="../js/shares.js"></script>
<script>
let me = null;
let all = [];
let lastSeen = 0;

function cell(t) { const td = document.createElement("td"); td.textContent = t; return td; }
function senderOf(f) { return f.owner ? (f.owner.full_name || f.owner.email) : "Unknown"; }

function render() {
  const body = document.getElementById("rows");
  const q = document.getElementById("rowFilter").value.trim().toLowerCase();
  const shown = all.filter(s => !q || s.file.original_name.toLowerCase().includes(q) || senderOf(s.file).toLowerCase().includes(q));
  document.getElementById("rowCount").textContent = "Showing " + shown.length + " of " + all.length;
  body.innerHTML = "";
  if (!all.length) { body.innerHTML = '<tr><td colspan="6" class="text-muted">No files have been shared with you yet.</td></tr>'; return; }
  if (!shown.length) { body.innerHTML = '<tr><td colspan="6" class="text-muted">No files match your search.</td></tr>'; return; }
  shown.forEach(s => {
    const f = s.file;
    const tr = document.createElement("tr");
    const nameTd = document.createElement("td");
    nameTd.textContent = f.original_name + " ";
    if (new Date(s.shared_at).getTime() > lastSeen) {
      const badge = document.createElement("span");
      badge.className = "badge text-bg-success"; badge.textContent = "New";
      nameTd.append(badge);
    }
    tr.append(nameTd, cell(senderOf(f)), cell(formatSize(f.file_size)), cell(formatDate(s.shared_at)),
              cell(s.expires_at ? formatDate(s.expires_at) : "No expiry"));
    const td = document.createElement("td");
    td.className = "text-end";
    const b = document.createElement("button");
    b.className = "btn btn-sm btn-main"; b.textContent = "Download";
    b.onclick = async () => {
      const r = await downloadFile(f, me.id);
      if (r.error) showMessage("msg", "Download failed: " + r.error + ". Your access may have been removed or expired.");
    };
    td.append(b); tr.append(td); body.append(tr);
  });
}

async function load() {
  const { data, error } = await listSharedWithMe(me.id);
  if (error) return showMessage("msg", "Could not load files: " + error.message);
  all = data;

  // notification: files shared since the last visit
  const key = "lastSeenShares_" + me.id;
  try { lastSeen = Number(localStorage.getItem(key)) || 0; } catch (e) { lastSeen = 0; }
  const fresh = all.filter(s => new Date(s.shared_at).getTime() > lastSeen).length;
  if (fresh > 0) {
    showMessage("notice", fresh === 1 ? "1 new file was shared with you." : fresh + " new files were shared with you.", "success");
  }
  render();
  try { localStorage.setItem(key, String(Date.now())); } catch (e) {}
}

document.getElementById("rowFilter").addEventListener("input", render);

(async () => {
  me = await requireRole("recipient");
  if (!me) return;
  document.getElementById("who").textContent = me.full_name || me.email;
  setupAvatar(me);
  load();
})();
</script>
</body>
</html>
