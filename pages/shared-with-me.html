<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <title>Shared with me - File Sharing Portal</title>
</head>
<body>
<nav class="topbar py-3">
  <div class="container d-flex justify-content-between align-items-center">
    <strong>File Sharing Portal</strong>
    <div><span id="who" class="me-3"></span><button class="btn btn-sm btn-outline-light" onclick="logoutUser()">Log out</button></div>
  </div>
</nav>
<main class="container py-5">
  <h1 class="h3">Shared with me</h1>
  <p class="text-muted">Files shared with you will appear here (Section 5).</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/auth.js"></script>
<script>
(async () => {
  const profile = await requireRole("recipient");
  if (profile) document.getElementById("who").textContent = profile.full_name || profile.email;
})();
</script>
</body>
</html>
