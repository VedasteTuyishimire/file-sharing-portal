<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <title>Owner dashboard - File Sharing Portal</title>
</head>
<body>
<nav class="topbar py-3">
  <div class="container d-flex justify-content-between align-items-center">
    <strong>File Sharing Portal</strong>
    <div class="d-flex align-items-center"><a href="activity.html" class="text-white me-3">Activity</a><button id="avatarBtn" type="button" class="avatar-btn me-2" title="Change profile picture" aria-label="Change profile picture"></button><span id="who" class="me-3"></span><button class="btn btn-sm btn-outline-light" onclick="logoutUser()">Log out</button></div>
  </div>
</nav>

<main class="container py-4">
  <div id="msg" class="alert d-none" role="alert"></div>

  <section class="card border-0 shadow-sm mb-4">
    <div class="card-body">
      <h2 class="h5">Upload a file</h2>
      <p class="text-muted small mb-3">PDF, DOCX, XLSX, PPTX, JPG, PNG or ZIP, up to 10 MB.</p>
      <div class="d-flex gap-2 flex-wrap">
        <input id="fileInput" type="file" class="form-control" style="max-width:380px"
               accept=".pdf,.docx,.xlsx,.pptx,.jpg,.jpeg,.png,.zip">
        <button id="uploadBtn" class="btn btn-main">Upload</button>
      </div>
    </div>
  </section>

  <section class="card border-0 shadow-sm">
    <div class="card-body">
      <h2 class="h5 mb-3">My files</h2>
      <div class="row g-2 mb-3">
        <div class="col-md-6"><input id="fileFilter" type="search" class="form-control" placeholder="Search by file name..."></div>
        <div class="col-md-3">
          <select id="typeFilter" class="form-select">
            <option value="">All types</option><option value="pdf">PDF</option><option value="docx">DOCX</option>
            <option value="xlsx">XLSX</option><option value="pptx">PPTX</option><option value="jpg">JPG</option>
            <option value="png">PNG</option><option value="zip">ZIP</option>
          </select>
        </div>
        <div class="col-md-3 d-flex align-items-center text-muted small" id="fileCount"></div>
      </div>
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead><tr><th>Name</th><th>Type</th><th>Size</th><th>Uploaded</th><th>Downloads</th><th class="text-end">Actions</th></tr></thead>
          <tbody id="fileRows"><tr><td colspan="6" class="text-muted">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<div class="modal fade" id="accessModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5" id="accessTitle">Share file</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="accessMsg" class="alert d-none" role="alert"></div>
        <div class="mb-3">
          <label for="accessEmail" class="form-label">Recipient email</label>
          <input id="accessEmail" type="email" class="form-control" placeholder="recipient@example.com">
        </div>
        <div class="mb-3">
          <label for="accessExpiry" class="form-label">Access expires on (optional)</label>
          <input id="accessExpiry" type="date" class="form-control">
        </div>
        <hr>
        <h3 class="h6">Who has access</h3>
        <ul id="accessList" class="list-group list-group-flush"></ul>
      </div>
      <div class="modal-footer justify-content-between">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
        <button id="accessBtn" type="button" class="btn btn-main" style="background:#0f766e;border-color:#0f766e;color:#fff;min-width:120px">Share file</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/avatar.js"></script>
<script src="../js/files.js"></script>
<script src="../js/shares.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let me = null;
let myFiles = [];

function cell(text) { const td = document.createElement("td"); td.textContent = text; return td; }
function actionBtn(label, cls, handler) {
  const b = document.createElement("button");
  b.className = "btn btn-sm " + cls; b.textContent = label; b.onclick = handler; return b;
}

let downloadCounts = {};

async function refresh() {
  const { data, error } = await listMyFiles(me.id);
  if (error) return showMessage("msg", "Could not load files: " + error.message);
  myFiles = data;
  downloadCounts = await getDownloadCounts(data.map(f => f.id));
  render();
}

function render() {
  const body = document.getElementById("fileRows");
  const q = document.getElementById("fileFilter").value.trim().toLowerCase();
  const type = document.getElementById("typeFilter").value;
  const shown = myFiles.filter(f => {
    const okName = !q || f.original_name.toLowerCase().includes(q);
    const t = (f.file_type || "").toLowerCase();
    const okType = !type || t === type || (type === "jpg" && t === "jpeg");
    return okName && okType;
  });
  document.getElementById("fileCount").textContent = "Showing " + shown.length + " of " + myFiles.length;
  body.innerHTML = "";
  if (!myFiles.length) {
    body.innerHTML = '<tr><td colspan="6" class="text-muted">No files yet. Upload your first file above.</td></tr>';
    return;
  }
  if (!shown.length) {
    body.innerHTML = '<tr><td colspan="6" class="text-muted">No files match your search.</td></tr>';
    return;
  }
  shown.forEach(f => {
    const tr = document.createElement("tr");
    tr.append(cell(f.original_name), cell((f.file_type || "").toUpperCase()), cell(formatSize(f.file_size)),
              cell(formatDate(f.uploaded_at)), cell(downloadCounts[f.id] || 0));
    const td = document.createElement("td");
    td.className = "text-end text-nowrap";
    td.append(
      actionBtn("Download", "btn-outline-secondary me-1", async () => {
        const r = await downloadFile(f, me.id);
        if (r.error) showMessage("msg", "Download failed: " + r.error);
      }),
      actionBtn("Share", "btn-main me-1", () => openShare(f)),
      actionBtn("Rename", "btn-outline-secondary me-1", async () => {
        const n = prompt("New file name:", f.original_name);
        if (n === null) return;
        const r = await renameFile(f, n);
        r.error ? showMessage("msg", r.error) : (showMessage("msg", "File renamed.", "success"), refresh());
      }),
      actionBtn("Delete", "btn-outline-danger", async () => {
        if (!confirm('Delete "' + f.original_name + '"? This cannot be undone.')) return;
        const r = await deleteFile(f, me.id);
        r.error ? showMessage("msg", r.error) : (showMessage("msg", "File deleted.", "success"), refresh());
      })
    );
    tr.append(td);
    body.append(tr);
  });
}

document.getElementById("fileFilter").addEventListener("input", render);
document.getElementById("typeFilter").addEventListener("change", render);

document.getElementById("uploadBtn").addEventListener("click", async () => {
  const input = document.getElementById("fileInput");
  if (!input.files.length) return showMessage("msg", "Choose a file first.");
  const btn = document.getElementById("uploadBtn");
  btn.disabled = true; btn.textContent = "Uploading...";
  const r = await uploadFile(input.files[0], me.id);
  btn.disabled = false; btn.textContent = "Upload";
  if (r.error) return showMessage("msg", r.error);
  input.value = "";
  showMessage("msg", "File uploaded.", "success");
  refresh();
});

let shareTarget = null;
let shareModal = null;

function shareStatus(sh) {
  if (sh.status === "revoked") return ["Revoked", "secondary"];
  if (sh.expires_at && new Date(sh.expires_at) <= new Date()) return ["Expired", "warning"];
  return ["Active", "success"];
}

async function renderShares() {
  const list = document.getElementById("accessList");
  list.innerHTML = "";
  const { data, error } = await listSharesForFile(shareTarget.id);
  if (error) { list.innerHTML = '<li class="list-group-item text-danger">Could not load shares.</li>'; return; }
  if (!data.length) { list.innerHTML = '<li class="list-group-item text-muted">Not shared with anyone yet.</li>'; return; }
  data.forEach(sh => {
    const [label, color] = shareStatus(sh);
    const li = document.createElement("li");
    li.className = "list-group-item d-flex justify-content-between align-items-center px-0";
    const info = document.createElement("div");
    const who = document.createElement("div");
    who.textContent = sh.recipient ? sh.recipient.email : "Unknown user";
    const meta = document.createElement("small");
    meta.className = "text-muted";
    meta.textContent = sh.expires_at ? "Expires " + formatDate(sh.expires_at) : "No expiry";
    info.append(who, meta);
    const right = document.createElement("div");
    const badge = document.createElement("span");
    badge.className = "badge text-bg-" + color + " me-2";
    badge.textContent = label;
    right.append(badge);
    if (sh.status === "active") {
      right.append(actionBtn("Revoke", "btn-outline-danger", async () => {
        if (!confirm("Remove this person's access?")) return;
        const r = await revokeShare(sh, shareTarget.id, me.id);
        r.error ? showMessage("accessMsg", r.error) : renderShares();
      }));
    }
    li.append(info, right);
    list.append(li);
  });
}

function openShare(f) {
  shareTarget = f;
  document.getElementById("accessTitle").textContent = "Share: " + f.original_name;
  document.getElementById("accessEmail").value = "";
  const d = document.getElementById("accessExpiry");
  d.value = ""; d.min = new Date().toISOString().split("T")[0];
  document.getElementById("accessMsg").classList.add("d-none");
  if (!shareModal) shareModal = new bootstrap.Modal(document.getElementById("accessModal"));
  shareModal.show();
  renderShares();
}

document.getElementById("accessEmail").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("accessBtn").click(); });
document.getElementById("accessBtn").addEventListener("click", async () => {
  const btn = document.getElementById("accessBtn");
  btn.disabled = true; btn.textContent = "Sharing...";
  const r = await shareFile(shareTarget, document.getElementById("accessEmail").value,
                            document.getElementById("accessExpiry").value, me.id);
  btn.disabled = false; btn.textContent = "Share file";
  if (r.error) return showMessage("accessMsg", r.error);
  showMessage("accessMsg", "File shared.", "success");
  document.getElementById("accessEmail").value = "";
  renderShares();
});

(async () => {
  me = await requireRole("owner");
  if (!me) return;
  document.getElementById("who").textContent = me.full_name || me.email;
  setupAvatar(me);
  refresh();
})();
</script>
</body>
</html>
