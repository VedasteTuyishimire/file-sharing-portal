<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <title>Log in - File Sharing Portal</title>
</head>
<body>
<div class="auth-wrap">
  <section class="auth-side">
    <h1>Share files with the right people only.</h1>
    <p>Upload a file, choose who can open it, and take access back whenever you need to.</p>
  </section>
  <section class="auth-form">
    <form id="loginForm" novalidate>
      <h2 class="h4 mb-4">Log in</h2>
      <div id="msg" class="alert d-none" role="alert"></div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input id="email" type="email" class="form-control" required autocomplete="email">
      </div>
      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input id="password" type="password" class="form-control" required autocomplete="current-password">
      </div>
      <button id="submitBtn" class="btn btn-main w-100" type="submit">Log in</button>
      <p class="mt-3 mb-0">No account yet? <a href="register.html">Create one</a></p>
    </form>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/auth.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (!email || !password) return showMessage("msg", "Enter your email and password.");

  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "Logging in...";

  const result = await loginUser(email, password);
  if (result.error) {
    showMessage("msg", result.error.message === "Invalid login credentials"
      ? "Email or password is incorrect." : result.error.message);
    btn.disabled = false; btn.textContent = "Log in";
  } else if (!result.profile) {
    showMessage("msg", "Logged in, but no profile was found. Re-run database/setup_all.sql in Supabase.");
    btn.disabled = false; btn.textContent = "Log in";
  } else {
    goToDashboard(result.profile.role);
  }
});

// already signed in? skip the form
(async () => {
  const { data } = await supabaseClient.auth.getSession();
  if (data.session) {
    const p = await getProfile(data.session.user.id);
    if (p) goToDashboard(p.role);
  }
})();
</script>
</body>
</html>
