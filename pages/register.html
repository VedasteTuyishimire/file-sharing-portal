<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <title>Create account - File Sharing Portal</title>
</head>
<body>
<div class="auth-wrap">
  <section class="auth-side">
    <h1>Share files with the right people only.</h1>
    <p>Upload a file, choose who can open it, and take access back whenever you need to.</p>
  </section>
  <section class="auth-form">
    <form id="registerForm" novalidate>
      <h2 class="h4 mb-4">Create your account</h2>
      <div id="msg" class="alert d-none" role="alert"></div>
      <div class="mb-3">
        <label for="fullName" class="form-label">Full name</label>
        <input id="fullName" class="form-control" required autocomplete="name">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input id="email" type="email" class="form-control" required autocomplete="email">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password (at least 6 characters)</label>
        <input id="password" type="password" class="form-control" minlength="6" required autocomplete="new-password">
      </div>
      <div class="mb-4">
        <label for="role" class="form-label">I want to</label>
        <select id="role" class="form-select">
          <option value="owner">Upload and share files (owner)</option>
          <option value="recipient">Receive files (recipient)</option>
        </select>
      </div>
      <button id="submitBtn" class="btn btn-main w-100" type="submit">Create account</button>
      <p class="mt-3 mb-0">Already registered? <a href="login.html">Log in</a></p>
    </form>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/auth.js"></script>
<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fullName = document.getElementById("fullName").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const role = document.getElementById("role").value;

  if (!fullName || !email || password.length < 6) {
    return showMessage("msg", "Enter your name, a valid email, and a password of at least 6 characters.");
  }
  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "Creating account...";

  const result = await registerUser(fullName, email, password, role);
  if (result.error) {
    showMessage("msg", result.error.message);
    btn.disabled = false; btn.textContent = "Create account";
  } else if (result.needsConfirmation) {
    showMessage("msg", "Account created. Check your email and click the confirmation link, then log in.", "success");
    btn.textContent = "Account created";
  } else {
    goToDashboard(role);
  }
});
</script>
</body>
</html>
